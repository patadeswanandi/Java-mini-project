<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Quest</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd, #c2e9fb);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .container {
        max-width: 700px;
        margin: 40px auto;
        background: rgba(255,255,255,0.9);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* ✨ Username Input Field */
    #username {
        padding: 12px 15px;
        width: 80%;
        border-radius: 30px;
        border: 2px solid #ddd;
        outline: none;
        font-size: 16px;
        transition: all 0.3s ease;
        text-align: center;
    }
    #username:focus {
        border-color: #ff758c;
        box-shadow: 0 0 10px rgba(255,117,140,0.4);
        background: #fffdfd;
    }

    /* 🎨 Fancy Start Button */
    .start-btn {
        padding: 12px 25px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg,#ff758c,#ff7eb3);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .start-btn:hover {
        background: linear-gradient(135deg,#ff9966,#ff5e62);
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* ✨ Heading styling */
    h1 {
        font-size: 2rem;
        background: linear-gradient(90deg,#ff758c,#ff7eb3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    h2, h3 {
        color: #333;
    }

    .option-btn {
        display: block;
        margin: 10px auto;
        width: 80%;
        font-size: 16px;
        background-color: #2196F3;
        color: white;
        padding: 10px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        transition: transform 0.2s, background 0.3s;
    }
    .option-btn:hover { 
        background-color: #0b7dda; 
        transform: scale(1.05);
    }

    #rpsDiv { display:none; margin-top:20px; }
    #rpsDiv button { width: 30%; }

    /* 🎨 Catchy Result Box */
    #rpsResult { 
        display:none; 
        margin-top:15px; 
        padding: 15px; 
        border-radius: 12px; 
        font-weight:bold; 
        font-size: 18px;
        animation: fadeIn 0.6s ease-in-out;
    }
    .rps-win { background: #d4edda; color: #155724; border: 2px solid #28a745; }
    .rps-lose { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
    .rps-draw { background: #fff3cd; color: #856404; border: 2px solid #ffc107; }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    #resultDiv { display:none; margin-top:20px; }
    .score-card {
        background: #f0f8ff;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* 🎈 Floating Emojis */
    .emoji {
        position: absolute;
        font-size: 2rem;
        animation: floatUp 3s linear forwards;
        pointer-events: none;
    }
    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>🔍 Quiz Portal</h1>
    <div id="userInputDiv">
        <input type="text" id="username" placeholder="Enter your username">
        <br><br>
        <button class="start-btn" onclick="startQuiz()">🚀 Start Quiz</button>
    </div>

    <div id="quizDiv" style="display:none;">
        <h2 id="questionText"></h2>
        <div id="optionsDiv"></div>
        <button class="start-btn" onclick="exitQuiz()">Exit Quiz</button>

        <div id="rpsDiv">
            <h3>🎮 Rock-Paper-Scissors Bonus!</h3>
            <p>Choose your move:</p>
            <button onclick="playRPS('rock')">Rock</button>
            <button onclick="playRPS('paper')">Paper</button>
            <button onclick="playRPS('scissors')">Scissors</button>
        </div>

        <div id="rpsResult"></div>
    </div>

    <div id="resultDiv" class="score-card">
        <h2 id="resultText"></h2>
        <button class="start-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
const questions = [
    {q:"What is the capital of France?", options:["Berlin","Madrid","Paris","Rome"], answer:2},
    {q:"Which language is used for Android development?", options:["Kotlin","Java","Python","C++"], answer:1},
    {q:"Who is the father of Computers?", options:["Charles Babbage","Alan Turing","Bill Gates","Steve Jobs"], answer:0},
    {q:"What is the national animal of India?", options:["Lion","Tiger","Elephant","Peacock"], answer:1},
    {q:"Which planet is known as the Red Planet?", options:["Jupiter","Venus","Earth","Mars"], answer:3},
    {q:"Who invented Java Programming?", options:["Dennis Ritchie","James Gosling","Guido van Rossum","Bjarne Stroustrup"], answer:1},
    {q:"What is the square root of 144?", options:["10","11","12","14"], answer:2},
    {q:"Which data structure uses LIFO?", options:["Queue","Stack","Array","Tree"], answer:1},
    {q:"What is 25 * 4?", options:["50","75","100","125"], answer:2},
    {q:"Which gas do plants release during photosynthesis?", options:["Oxygen","Carbon Dioxide","Nitrogen","Hydrogen"], answer:0},
    {q:"Who is known as the Missile Man of India?", options:["Vikram Sarabhai","APJ Abdul Kalam","Homi Bhabha","C. V. Raman"], answer:1},
    {q:"What is the boiling point of water (in Celsius)?", options:["0","50","100","212"], answer:2},
    {q:"Which ocean is the largest?", options:["Atlantic","Pacific","Indian","Arctic"], answer:1},
    {q:"Which year did World War II end?", options:["1918","1939","1945","1965"], answer:2},
    {q:"Who wrote 'Romeo and Juliet'?", options:["William Wordsworth","William Shakespeare","Charles Dickens","John Milton"], answer:1},
    {q:"Which device is used to measure temperature?", options:["Barometer","Thermometer","Speedometer","Altimeter"], answer:1},
    {q:"What is the chemical symbol for Gold?", options:["Ag","Au","Pb","Pt"], answer:1},
    {q:"Who discovered gravity?", options:["Albert Einstein","Isaac Newton","Galileo Galilei","Nikola Tesla"], answer:1},
    {q:"Which is the fastest land animal?", options:["Horse","Leopard","Cheetah","Tiger"], answer:2},
    {q:"Who painted the Mona Lisa?", options:["Leonardo da Vinci","Pablo Picasso","Vincent Van Gogh","Michelangelo"], answer:0}
];

let currentQ = 0;
let score = 0;
let bonusAnswer = '';

function startQuiz() {
    const username = document.getElementById('username').value;
    if(!username) { alert("Enter username!"); return; }
    document.getElementById('userInputDiv').style.display='none';
    document.getElementById('quizDiv').style.display='block';
    currentQ = 0; score = 0;
    showQuestion();
}

function showQuestion() {
    document.getElementById('rpsDiv').style.display='none';
    document.getElementById('rpsResult').style.display='none';
    if(currentQ >= questions.length){
        endQuiz();
        return;
    }
    const q = questions[currentQ];
    document.getElementById('questionText').innerText = q.q;
    const optionsDiv = document.getElementById('optionsDiv');
    optionsDiv.innerHTML='';
    q.options.forEach((opt,i)=>{
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.className='option-btn';
        btn.onclick = ()=>checkAnswer(i);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(choice){
    const q = questions[currentQ];
    if(choice === q.answer){
        score++;
        currentQ++;
        showQuestion();
    } else {
        bonusAnswer = q.options[q.answer];
        document.getElementById('rpsDiv').style.display='block';
    }
}

function playRPS(userMove){
    const moves = ["rock","paper","scissors"];
    const compMove = moves[Math.floor(Math.random()*3)];
    const resultBox = document.getElementById('rpsResult');
    let rpsMessage = '';
    let cssClass = '';

    if(userMove === compMove){
        rpsMessage = `🤝 It's a Draw! No bonus point.`;
        cssClass = "rps-draw";
    } else if(
        (userMove==="rock" && compMove==="scissors") ||
        (userMove==="paper" && compMove==="rock") ||
        (userMove==="scissors" && compMove==="paper")
    ){
        rpsMessage = `🎉 You won Rock-Paper-Scissors! Bonus point awarded.`;
        score++;
        cssClass = "rps-win";
        launchEmojis(["🎉","🎈","✨"]);
    } else {
        rpsMessage = `😢 You lost Rock-Paper-Scissors.`;
        cssClass = "rps-lose";
    }

    resultBox.className = cssClass;
    resultBox.style.display = 'block';
    resultBox.innerHTML = `${rpsMessage}<br>✅ Correct Answer: ${bonusAnswer}`;

    currentQ++;
    setTimeout(showQuestion, 3000);
}

/* 🎈 Emoji Animation */
function launchEmojis(emojis){
    for(let i=0;i<8;i++){
        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.innerText = emojis[Math.floor(Math.random()*emojis.length)];
        emoji.style.left = Math.random()*90 + "%";
        emoji.style.bottom = "0";
        document.body.appendChild(emoji);

        setTimeout(()=>{ emoji.remove(); },3000);
    }
}

function exitQuiz(){
    endQuiz();
}

function endQuiz(){
    document.getElementById('quizDiv').style.display='none';
    document.getElementById('resultDiv').style.display='block';
    document.getElementById('resultText').innerText = `🎓 Quiz Over! Your Score: ${score}/${currentQ}`;
}
</script>
</body>
</html>
